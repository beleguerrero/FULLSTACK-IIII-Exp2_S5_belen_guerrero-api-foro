
name: Configure Nginx on EC2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configure-nginx-ec2
  cancel-in-progress: false

jobs:
  configure-nginx:
    name: Configure Nginx through SSM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AWS_REGION: us-east-1
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      NGINX_LISTEN_PORT: "80"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]] || {
            echo "::error::Set EC2_INSTANCE_ID to a valid EC2 instance ID."
            exit 1
          }

          [[ -f ec2/configure-nginx.sh ]] || {
            echo "::error::Missing ec2/configure-nginx.sh."
            exit 1
          }

          bash -n ec2/configure-nginx.sh

          echo "Configuration validated."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify EC2 and SSM access
        shell: bash
        run: |
          set -Eeuo pipefail

          STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${EC2_INSTANCE_ID}" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)

          [[ "$STATUS" == "Online" ]] || {
            echo "::error::EC2 instance is not online in SSM: $STATUS"
            exit 1
          }

          echo "EC2 is online in SSM."

      - name: Prepare Nginx configuration script
        shell: bash
        run: |
          set -Eeuo pipefail

          gzip -c ec2/configure-nginx.sh | base64 -w 0 > /tmp/configure-nginx.b64

          echo "Nginx script prepared."

      - name: Execute Nginx configuration on EC2
        id: ssm
        shell: bash
        run: |
          set -Eeuo pipefail

          SCRIPT_B64=$(cat /tmp/configure-nginx.b64)

          REMOTE_COMMAND=$(cat <<EOF
          set -Eeuo pipefail
          remote_script=\$(mktemp /tmp/configure-nginx.XXXXXX.sh)
          trap "rm -f \\\$remote_script" EXIT
          echo '${SCRIPT_B64}' | base64 -d | gzip -d > "\\\$remote_script"
          chmod 700 "\\\$remote_script"
          sudo env NGINX_LISTEN_PORT=${NGINX_LISTEN_PORT} bash "\\\$remote_script"
          EOF
          )

          PARAMETERS=$(jq -n --arg command "$REMOTE_COMMAND" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --comment "Configure Nginx reverse proxy for mi-foro APIs" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command sent: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                echo "Nginx configured successfully."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text

                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                echo "::error::Nginx configuration failed: $STATUS"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' \
                  --output json || true

                exit 1
                ;;

              *)
                sleep 5
                ;;
            esac
          done

          echo "::error::Timeout waiting for SSM command."
          exit 1
